<style>
/* ==========================================================================
   Design system do produto (extraído de praticidade-na-cozinha)
   Regra de forma: cards 18px, elementos interativos em pílula. Sem exceção.
   Regra de cor: 1 acento (primary). Cores de categoria só codificam conteúdo.
   ========================================================================== */
:root{
  color-scheme:light; /* a marca tem um único tema quente. Não deixar o browser forçar dark. */
  --bg:#FFF8F1; --surface:#FFFFFF; --surface-2:#FDF3E9;
  --ink:#2B2118; --ink-soft:#6B5D52; --line:#EFE2D4;
  --primary:#E63946; --primary-dark:#C22733;
  --warn:#9C2A16;
  --veg:#3F8F52; --prot:#C1502E; --acmp:#B9852B; --frio:#3E6F8E;
  --r-card:18px; --r-pill:999px;
  --sh-soft:0 2px 8px rgba(120,72,40,.08), 0 1px 2px rgba(120,72,40,.06);
  --sh-card:0 6px 20px rgba(120,72,40,.10), 0 2px 6px rgba(120,72,40,.06);
  --sh-lift:0 14px 40px rgba(120,72,40,.18), 0 4px 12px rgba(120,72,40,.10);
  --sh-primary:0 8px 22px rgba(230,57,70,.30);
  --font-display:'Baloo 2',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- Shell ---------- */
.shell{
  min-height:100dvh;display:flex;flex-direction:column;
  max-width:520px;margin:0 auto;position:relative;
}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:14px 20px 10px;
  padding-top:calc(14px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:12px;min-height:56px;
}
.topbar::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:16px;
  background:linear-gradient(var(--bg),rgba(255,248,241,0));pointer-events:none;
  transform:translateY(100%);
}
.back{
  width:44px;height:44px;flex:0 0 44px;border:1px solid var(--line);
  background:var(--surface);border-radius:var(--r-pill);
  display:grid;place-items:center;box-shadow:var(--sh-soft);
  transition:transform .18s var(--ease),opacity .18s;
}
.back:active{transform:scale(.92)}
.back[hidden]{display:none}
.track{
  flex:1;height:6px;background:var(--line);border-radius:var(--r-pill);overflow:hidden;
}
.track > i{
  display:block;height:100%;width:0%;background:var(--primary);
  border-radius:var(--r-pill);transition:width .45s var(--ease);
}
.counter{
  font-family:var(--font-mono);font-size:12px;font-weight:700;
  color:var(--ink-soft);letter-spacing:.02em;flex:0 0 auto;
}
.stage{
  flex:1;display:flex;flex-direction:column;
  padding:8px 20px 32px;
  padding-bottom:calc(32px + env(safe-area-inset-bottom));
}

/* ---------- Transição de tela ---------- */
.screen{display:flex;flex-direction:column;flex:1;animation:enter .34s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stag{animation:enter .38s var(--ease) both}

/* ---------- Tipografia ---------- */
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:-.01em;margin:0}
h1:focus{outline:none} /* recebe foco programático a cada tela, não é interativo */
.q-title{font-size:1.6rem;line-height:1.18;margin-bottom:8px}
.q-help{color:var(--ink-soft);font-size:.94rem;margin:0 0 20px}
.i-title{font-size:1.75rem;line-height:1.14;margin-bottom:12px}
.i-body{color:var(--ink-soft);font-size:1rem;margin:0 0 16px}
.i-body strong{color:var(--ink);font-weight:600}

/* ---------- Opções ---------- */
.opts{display:grid;gap:10px;margin:0 0 8px}
.opt{
  width:100%;text-align:left;background:var(--surface);
  border:1.5px solid var(--line);border-radius:var(--r-card);
  padding:16px 18px;min-height:56px;
  display:flex;align-items:center;gap:14px;
  box-shadow:var(--sh-soft);
  transition:transform .16s var(--ease),border-color .16s,box-shadow .16s,background .16s;
}
.opt:hover{border-color:#E2CEB8}
.opt:active{transform:scale(.982)}
.opt:focus-visible{outline:3px solid rgba(230,57,70,.35);outline-offset:2px}
.opt .dot{
  flex:0 0 22px;height:22px;border-radius:var(--r-pill);
  border:2px solid var(--line);background:var(--bg);
  display:grid;place-items:center;transition:all .18s var(--ease);
}
.opt .dot svg{width:12px;height:12px;opacity:0;transform:scale(.5);transition:all .18s var(--ease)}
.opt .txt{flex:1;font-size:1rem;line-height:1.35}
.opt[aria-checked="true"],.opt[aria-pressed="true"]{
  border-color:var(--primary);background:#FFF4F4;box-shadow:var(--sh-card);
}
.opt[aria-checked="true"] .dot,.opt[aria-pressed="true"] .dot{
  background:var(--primary);border-color:var(--primary);
}
.opt[aria-checked="true"] .dot svg,.opt[aria-pressed="true"] .dot svg{opacity:1;transform:scale(1)}
.opt.quote .txt{font-size:.99rem}
.opt.quote .txt b{font-weight:600}

/* ---------- Botões ---------- */
.cta{
  width:100%;border:0;background:var(--primary);color:#fff;
  border-radius:var(--r-pill);padding:17px 22px;min-height:56px;
  font-family:var(--font-display);font-weight:700;font-size:1.06rem;line-height:1.1;
  box-shadow:var(--sh-primary);
  transition:transform .16s var(--ease),background .16s;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  text-decoration:none;text-align:center;
}
.cta:hover{background:var(--primary-dark)}
.cta:active{transform:scale(.975)}
.cta:disabled{opacity:.42;box-shadow:none;cursor:not-allowed}
.cta:focus-visible{outline:3px solid rgba(230,57,70,.4);outline-offset:3px}
.foot{margin-top:auto;padding-top:20px}
.microcopy{
  text-align:center;color:var(--ink-soft);font-size:.82rem;margin:12px 0 0;
}

/* ---------- Input ---------- */
.field{margin:4px 0 0}
.field label{display:block;font-weight:600;font-size:.9rem;margin-bottom:8px}
.field input{
  width:100%;height:60px;background:var(--surface);
  border:1.5px solid var(--line);border-radius:var(--r-card);
  padding:0 18px;font-family:var(--font-body);font-size:1.05rem;color:var(--ink);
  box-shadow:var(--sh-soft);transition:border-color .18s;
}
.field input::placeholder{color:#A6968A}
.field input:focus{outline:none;border-color:var(--primary)}
.field .hint{color:var(--ink-soft);font-size:.84rem;margin:8px 0 0}
.field .err{color:var(--warn);font-size:.86rem;margin:8px 0 0;font-weight:500}

/* ---------- Cards de conteúdo ---------- */
.media{
  border-radius:var(--r-card);overflow:hidden;box-shadow:var(--sh-card);
  border:1px solid var(--line);margin-bottom:20px;background:var(--surface-2);
}
/* sem crop forçado: cada imagem mantém a proporção nativa e reserva o espaço
   pelos atributos width/height, para não pular o layout ao carregar */
.media img{width:100%;height:auto}
.media.tall{max-width:250px;margin-left:auto;margin-right:auto;background:transparent}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:20px;box-shadow:var(--sh-soft);
}
.bignum{
  font-family:var(--font-mono);font-weight:700;font-size:2.9rem;line-height:1;
  color:var(--primary);letter-spacing:-.02em;
}
.bignum small{font-size:1.1rem;font-weight:500;color:var(--ink-soft);display:block;margin-top:8px;font-family:var(--font-body);letter-spacing:0}

/* comparativo (usado 1x) */
.versus{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.versus > div{
  border-radius:var(--r-card);padding:16px;border:1px solid var(--line);
  background:var(--surface);box-shadow:var(--sh-soft);
}
.versus .now{background:var(--surface-2)}
.versus h3{font-size:.8rem;text-transform:none;font-weight:700;color:var(--ink-soft);margin-bottom:6px;font-family:var(--font-body)}
.versus .v{font-family:var(--font-mono);font-weight:700;font-size:1.75rem;line-height:1}
.versus .now .v{color:var(--ink-soft)}
.versus .new .v{color:var(--veg)}
.versus p{margin:8px 0 0;font-size:.84rem;color:var(--ink-soft);line-height:1.4}

/* métodos de descongelamento (usado 1x) */
.methods{display:grid;gap:10px;margin-bottom:16px}
.method{
  display:flex;align-items:center;gap:14px;background:var(--surface);
  border:1px solid var(--line);border-left:4px solid var(--frio);
  border-radius:var(--r-card);padding:14px 16px;box-shadow:var(--sh-soft);
}
.method .m-n{font-family:var(--font-display);font-weight:700;font-size:1rem;flex:1}
.method .m-n span{display:block;font-family:var(--font-body);font-weight:400;font-size:.82rem;color:var(--ink-soft)}
.method .m-t{font-family:var(--font-mono);font-weight:700;font-size:.95rem;color:var(--frio);white-space:nowrap}

/* roteiro em grade (usado 1x) */
.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.step{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:11px 12px;box-shadow:var(--sh-soft);
}
.step .s-m{font-family:var(--font-mono);font-weight:700;font-size:.78rem;color:var(--primary);display:block}
.step .s-t{font-size:.86rem;line-height:1.25;font-weight:500;margin-top:2px;display:block}

/* ---------- Loading ---------- */
.loader{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:22px;padding:20px 0}
.ring{position:relative;width:112px;height:112px}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--primary);transition:stroke-dashoffset .3s linear}
.ring b{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--font-mono);font-weight:700;font-size:1.3rem;
}
.tasks{display:grid;gap:9px;width:100%;max-width:300px}
.task{
  display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--ink-soft);
  opacity:.32;transition:opacity .3s,color .3s;
}
.task.on{opacity:1;color:var(--ink);font-weight:500}
.task i{
  width:20px;height:20px;flex:0 0 20px;border-radius:var(--r-pill);
  border:2px solid var(--line);display:grid;place-items:center;transition:all .3s var(--ease);
}
.task.on i{background:var(--veg);border-color:var(--veg)}
.task i svg{width:11px;height:11px;opacity:0;transition:opacity .2s}
.task.on i svg{opacity:1}

/* ---------- Resultado ---------- */
.result{padding-bottom:12px}
.result section{margin-bottom:26px}
.r-hi{
  background:linear-gradient(160deg,#fff 0%,#FFF4F4 100%);
  border:1.5px solid #F6D9DB;border-radius:var(--r-card);
  padding:22px;box-shadow:var(--sh-card);
}
.r-profile{font-family:var(--font-display);font-weight:800;font-size:1.6rem;line-height:1.16;margin:0 0 10px}
.r-profile-b{margin:0;color:var(--ink-soft);font-size:.97rem}
.r-h{font-family:var(--font-display);font-weight:800;font-size:1.28rem;margin:0 0 12px;line-height:1.2}
.r-p{margin:0 0 14px;color:var(--ink-soft)}
.r-p strong{color:var(--ink);font-weight:600}
.cost{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
.plan-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);
  padding:8px 14px;font-size:.86rem;font-weight:600;box-shadow:var(--sh-soft);
}
.chip .k{color:var(--ink-soft);font-weight:400}
.fits{display:grid;gap:10px}
.fit{
  display:flex;gap:13px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-card);padding:15px 16px;box-shadow:var(--sh-soft);
}
.fit .ic{flex:0 0 30px;height:30px;border-radius:var(--r-pill);display:grid;place-items:center}
.fit .ic svg{width:16px;height:16px}
.fit b{display:block;font-family:var(--font-display);font-weight:700;font-size:1rem;line-height:1.2;margin-bottom:3px}
.fit p{margin:0;font-size:.89rem;color:var(--ink-soft);line-height:1.45}

.offer{
  background:var(--ink);color:#FFF3E9;border-radius:var(--r-card);
  padding:24px 22px;box-shadow:var(--sh-lift);
}
.offer h2{color:#fff;font-size:1.35rem;margin-bottom:8px;line-height:1.2}
.offer > p{margin:0 0 18px;color:#D9C9BC;font-size:.95rem}
.price{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.price .n{font-family:var(--font-mono);font-weight:700;font-size:2.7rem;color:#fff;line-height:1}
.price .u{font-size:.9rem;color:#D9C9BC}
.perks{list-style:none;margin:16px 0 20px;padding:0;display:grid;gap:9px}
.perks li{display:flex;align-items:center;gap:10px;font-size:.93rem;color:#EFE0D3}
.perks svg{width:16px;height:16px;flex:0 0 16px;color:#8CC79B}
.faq{display:grid;gap:10px}
.faq details{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--sh-soft);overflow:hidden;
}
.faq summary{
  list-style:none;cursor:pointer;padding:16px 18px;font-weight:600;font-size:.96rem;
  display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;
}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--font-mono);font-size:1.3rem;color:var(--primary);line-height:1}
.faq details[open] summary::after{content:"\2212"} /* sinal de menos, pareia com o "+" */
.faq p{margin:0;padding:0 18px 17px;color:var(--ink-soft);font-size:.92rem}
.legal{text-align:center;color:var(--ink-soft);font-size:.78rem;margin:22px 0 0;line-height:1.5}

/* barra fixa de compra no resultado */
.buybar{
  position:sticky;bottom:0;z-index:30;
  margin:0 -20px calc(-32px - env(safe-area-inset-bottom));
  padding:12px 20px calc(14px + env(safe-area-inset-bottom));
  background:rgba(255,248,241,.92);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
}
@supports not (backdrop-filter:blur(4px)){.buybar{background:var(--bg)}}

/* ---------- Abertura ---------- */
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:0}
.intro .logo{width:78px;margin:0 auto 20px;border-radius:var(--r-card)}
.intro h1{font-size:2rem;line-height:1.12;margin-bottom:14px}
.intro p{color:var(--ink-soft);margin:0 auto 26px;max-width:34ch;font-size:1.02rem}
.intro .time{
  display:inline-flex;align-items:center;gap:8px;margin:16px auto 0;
  font-size:.84rem;color:var(--ink-soft);
}
.intro .time svg{width:15px;height:15px}

@media (min-width:560px){
  .q-title{font-size:1.78rem}
  .i-title{font-size:1.95rem}
  .intro h1{font-size:2.3rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;animation-delay:0ms!important;
    animation-iteration-count:1!important;transition-duration:.001ms!important;
  }
}
</style>
</head>

var A = {};            // respostas
var idx = 0;
var stage = document.getElementById("stage");
var topbar = document.getElementById("topbar");
var bar = document.getElementById("bar");
var trackEl = document.getElementById("trackEl");
var counter = document.getElementById("counter");
var backBtn = document.getElementById("back");

try{ var saved = sessionStorage.getItem("cg-quiz"); if(saved){ A = JSON.parse(saved) || {}; } }catch(e){}
function persist(){ try{ sessionStorage.setItem("cg-quiz", JSON.stringify(A)); }catch(e){} }

var QIDS = FLOW.filter(function(s){return s.type==="q";}).map(function(s){return s.id;});
function qNumber(id){ return QIDS.indexOf(id)+1; }

function nome(){ return A.nome ? A.nome : "Você"; }
function tok(s){ return String(s).replace(/\{nome\}/g, A.nome ? A.nome : "Olha"); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function brl(n){ return "R$" + Math.round(n).toLocaleString("pt-BR"); }

function gastoMes(){
  var map = {"1":1.5,"3":3.5,"5":5.5,"6":6.5};
  var v = map[A.fora] || 3.5;
  return Math.round((v * TICKET * SEMANAS_MES) / 10) * 10;  // arredondado, é estimativa
}

   ========================================================================== */
function go(n){
  idx = Math.max(0, Math.min(FLOW.length-1, n));
  render();
  window.scrollTo(0,0);
  // foco no título da tela nova, para leitor de tela e navegação por teclado
  var h = stage.querySelector("h1");
  if(h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); }
}
function next(){ go(idx+1); }
function prev(){
  var i = idx-1;
  while(i>0 && FLOW[i].type==="loading") i--;
  go(i);
}
backBtn.addEventListener("click", prev);

function chrome(){
  var s = FLOW[idx];
  var show = (s.type==="q" || s.type==="i");
  topbar.hidden = !show;
  backBtn.hidden = (idx<=1);
  if(!show) return;
  var done = 0;
  for(var i=0;i<idx;i++) if(FLOW[i].type==="q") done++;
  var pct = Math.round((done/QIDS.length)*100);
  bar.style.width = pct + "%";
  trackEl.setAttribute("aria-valuenow", String(pct));
  // o contador só aparece nas perguntas. Nos interstícios ele confundiria.
  counter.textContent = (s.type==="q" ? qNumber(s.id) + "/" + QIDS.length : "");
}

function render(){
  chrome();
  var s = FLOW[idx];
  stage.innerHTML = "";
  if(s.type==="intro") return renderIntro();
  if(s.type==="q") return renderQ(s);
  if(s.type==="i") return INTER[s.render](s);
  if(s.type==="loading") return renderLoading();
  if(s.type==="result") return renderResult();
}

function renderQ(s){
  var el = document.createElement("div");
  el.className = "screen";
  var h = '<h1 class="q-title">' + esc(tok(s.title)) + '</h1>';
  if(s.help) h += '<p class="q-help">' + esc(tok(s.help)) + '</p>';
  el.innerHTML = h;

  if(s.kind==="text"){
    var f = document.createElement("div");
    f.className = "field";
    f.innerHTML =
      '<label for="nm">Seu nome</label>' +
      '<input id="nm" type="text" autocomplete="given-name" enterkeyhint="go" maxlength="24" placeholder="' + esc(s.placeholder) + '">' +
      '<p class="err" id="er" hidden>Escreve seu nome pra eu continuar.</p>';
    el.appendChild(f);

    var foot = document.createElement("div");
    foot.className = "foot";
    foot.innerHTML = '<button class="cta" id="go" type="button" disabled>Continuar ' + ICON.arrow + '</button>';
    el.appendChild(foot);
    stage.appendChild(el);

    var inp = el.querySelector("#nm");
    var btn = el.querySelector("#go");
    var er = el.querySelector("#er");
    if(A.nome) inp.value = A.nome;
    var check = function(){ btn.disabled = inp.value.trim().length < 2; };
    check();
    inp.addEventListener("input", function(){ er.hidden = true; check(); });
    inp.addEventListener("keydown", function(e){ if(e.key==="Enter" && !btn.disabled) submit(); });
    btn.addEventListener("click", submit);
    setTimeout(function(){ inp.focus(); }, 260);
    function submit(){
      var v = inp.value.trim();
      if(v.length < 2){ er.hidden = false; inp.focus(); return; }
      A.nome = v.charAt(0).toUpperCase() + v.slice(1);
      persist(); next();
    }
    return;
  }

  var multi = s.kind === "multi";
  var wrap = document.createElement("div");
  wrap.className = "opts";
  wrap.setAttribute("role", multi ? "group" : "radiogroup");
  wrap.setAttribute("aria-label", tok(s.title));

  var cur = A[s.id];
  s.opts.forEach(function(o, i){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "opt" + (s.quote ? " quote" : "");
    b.className += " stag";
    b.style.animationDelay = (i*45) + "ms";
    var on = multi ? (Array.isArray(cur) && cur.indexOf(o.v)>-1) : (cur === o.v);
    if(multi){ b.setAttribute("role","checkbox"); b.setAttribute("aria-pressed", on?"true":"false"); }
    else{ b.setAttribute("role","radio"); b.setAttribute("aria-checked", on?"true":"false"); }
    b.innerHTML = '<span class="dot" aria-hidden="true">' + ICON.check + '</span><span class="txt">' + esc(o.t) + '</span>';
    b.addEventListener("click", function(){
      if(multi){
        var arr = Array.isArray(A[s.id]) ? A[s.id].slice() : [];
        var p = arr.indexOf(o.v);
        if(p>-1) arr.splice(p,1); else arr.push(o.v);
        A[s.id] = arr; persist();
        b.setAttribute("aria-pressed", arr.indexOf(o.v)>-1 ? "true":"false");
        var gobtn = el.querySelector("#go"); if(gobtn) gobtn.disabled = arr.length===0;
      }else{
        A[s.id] = o.v; persist();
        Array.prototype.forEach.call(wrap.children, function(c){ c.setAttribute("aria-checked","false"); });
        b.setAttribute("aria-checked","true");
        setTimeout(next, 240);
      }
    });
    wrap.appendChild(b);
  });
  el.appendChild(wrap);

  if(multi){
    var f2 = document.createElement("div");
    f2.className = "foot";
    f2.innerHTML = '<button class="cta" id="go" type="button">Continuar ' + ICON.arrow + '</button>';
    el.appendChild(f2);
    stage.appendChild(el);
    var g = el.querySelector("#go");
    g.disabled = !(Array.isArray(A[s.id]) && A[s.id].length);
    g.addEventListener("click", next);
    return;
  }
  stage.appendChild(el);
}

/* ---------- Loading ---------- */
function renderLoading(){
  var el = document.createElement("div");
  el.className = "screen";
  var tasks = ["Lendo suas respostas","Escolhendo o roteiro do seu dia","Ajustando as quantidades","Montando seu diagnóstico"];
  el.innerHTML =
    '<div class="loader">' +
      '<div class="ring">' +
        '<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bgc" cx="60" cy="60" r="52"/><circle class="fgc" id="fg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>' +
        '<b id="pc">0%</b>' +
      '</div>' +
      '<h1 class="i-title" style="font-size:1.35rem;margin:0">Montando o plano de ' + esc(nome()) + '</h1>' +
      '<div class="tasks">' + tasks.map(function(t,i){
        return '<div class="task" id="t'+i+'"><i>'+ICON.checkG+'</i><span>'+t+'</span></div>';
      }).join("") + '</div>' +
    '</div>';
  stage.appendChild(el);

  // Progresso por relógio, não por contador de ticks. Se o usuário trocar de app
  // no meio, o navegador estrangula timers e um setInterval trava na metade.
  var fg = el.querySelector("#fg"), pc = el.querySelector("#pc");
  var C = 326.7, DUR = 2300, t0 = Date.now(), done = -1, finished = false;

  function paint(){
    var p = Math.min(100, ((Date.now()-t0)/DUR)*100);
    fg.style.strokeDashoffset = String(C - (C*p/100));
    pc.textContent = Math.round(p) + "%";
    var step = Math.min(3, Math.floor(p/25));
    if(step !== done){ done = step; var t = el.querySelector("#t"+step); if(t) t.classList.add("on"); }
    if(p >= 100){ finish(); return; }
    raf = requestAnimationFrame(paint);
  }
  function finish(){
    if(finished) return; finished = true;
    cancelAnimationFrame(raf); clearTimeout(guard);
    for(var i=0;i<4;i++){ var t = el.querySelector("#t"+i); if(t) t.classList.add("on"); }
    fg.style.strokeDashoffset = "0"; pc.textContent = "100%";
    setTimeout(function(){ if(FLOW[idx].type==="loading") next(); }, 380);
  }
  var raf = requestAnimationFrame(paint);
  var guard = setTimeout(finish, DUR + 500);   // garante que ninguém fica preso aqui
}

  }
  return out.slice(0,4);
}
